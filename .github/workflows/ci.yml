# CI: 型検査・単体テスト・ビルド（plan.md T-102）。
# PR と main への push で実行する。秘密情報は使わない（ビルドは環境変数なしで通る）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: 単体テスト（core の行カバレッジ 90% 以上）
        run: npm run test:coverage
      - name: ビルド
        run: npm run build

  # DB のテスト（pgTAP の DB-01〜18 と同時回答の DB-19）。Neon の一時ブランチ（1 時間で自動削除）で実行する。
  # リポジトリの Secrets に NEON_API_KEY が無いとき（フォークからの PR など）は飛ばす。
  db:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 共有テストベクタから生成した pgTAP が最新か
        run: npm run check:db-vectors
      - name: Neon の一時ブランチで DB テスト
        if: env.NEON_API_KEY != ''
        run: npm run test:db
      - name: NEON_API_KEY が無いので DB テストを飛ばす
        if: env.NEON_API_KEY == ''
        run: echo "NEON_API_KEY が設定されていないため、DB テストを飛ばしました。"

  # E2E（Playwright）。Neon への通信は偽の応答に差し替えるので、秘密情報は使わない（e2e/fakeBackend.ts）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright のブラウザ
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      - name: 失敗時の記録
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
