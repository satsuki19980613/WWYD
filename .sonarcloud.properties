# SonarCloud（自動解析）の設定。https://sonarcloud.io/project/overview?id=satsuki19980613_WWYD
# 製品のコードとテストを分け、編集しない参照資料と生成物を解析から外す。

sonar.sources=.
sonar.tests=.

# 製品のコードから外すもの
# - docs/source/: 仕様書とモック（CLAUDE.md §2。編集禁止の参照資料で、アプリには含まれない）
# - 生成物: OCR のテンプレート（scripts/ocr/genRankTemplates.mts）、公開用のサンプル投稿（scripts/genShowcaseSql.ts）
# - テスト（下の test.inclusions に入れる）
sonar.exclusions=docs/source/**,packages/ocr/src/rankTemplates.ts,db/seed/showcase.sql,e2e/**,db/tests/**,**/*.test.ts,**/*.test.tsx,**/*.tb.*.ts

# テストのコード
# - e2e/: Playwright
# - db/tests/: pgTAP（03_paint_vectors は scripts/genPaintVectorsSql.mjs の生成物なので外す）
# - *.test.ts(x): Vitest。*.tb.*.ts はリリース前の総合テスト（観点 B）の試験用の部品
sonar.test.inclusions=e2e/**,db/tests/**,**/*.test.ts,**/*.test.tsx,**/*.tb.*.ts
sonar.test.exclusions=db/tests/03_paint_vectors.test.sql,node_modules/**

# 重複の検出から外すもの（テストは同じ形の手順を並べるのが普通）
sonar.cpd.exclusions=e2e/**,db/tests/**,db/seed/**,**/*.test.ts,**/*.test.tsx

# 指摘を外す規則（理由つき）
sonar.issue.ignore.multicriteria=awaitloop1,awaitloop2,awaitloop3,awaitloop4,sqllit1,sqlnl1,sqluser1

# ループの中の await は順番どおりに行うためのもの: E2E の画面の操作、スクリプトの DB のマイグレーションと pgTAP、
# OCR（tesseract の Worker は 1 つで、モードごとに設定を変えて使う。精度の測定は画像ごとに時間も測る）
sonar.issue.ignore.multicriteria.awaitloop1.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitloop1.resourceKey=e2e/**
sonar.issue.ignore.multicriteria.awaitloop2.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.awaitloop2.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.awaitloop3.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitloop3.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.awaitloop4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitloop4.resourceKey=packages/ocr/src/readHandHistory.ts

# db/ の SQL は PostgreSQL。PL/SQL（Oracle）の規則のうち、次の 2 つは当てはまらない
# - 同じ文字列（UUID・ストリート名など）の繰り返し: テストと試験データの値で、PostgreSQL には定数のパッケージがない
sonar.issue.ignore.multicriteria.sqllit1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqllit1.resourceKey=db/**
# - 文字列の中の改行: 複数行の JSON の値（jsonb）で、意図したもの
sonar.issue.ignore.multicriteria.sqlnl1.ruleKey=plsql:LiteralsNonPrintableCharactersCheck
sonar.issue.ignore.multicriteria.sqlnl1.resourceKey=db/**

# neon_auth."user" は Neon Auth が作る表で、名前を変えられない
sonar.issue.ignore.multicriteria.sqluser1.ruleKey=postgresdre:S8942
sonar.issue.ignore.multicriteria.sqluser1.resourceKey=db/tests/**
