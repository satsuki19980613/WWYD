<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スポット集合知 試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDEFF2;--surface:#FFFFFF;--surface2:#E3E6EA;--line:#CBD0D6;--text:#1A1D22;--muted:#555C68;
  --accent:#9A520D;--fill:#F0A04B;--info:#1F5FB0;--infoBg:#E3EDF8;--infoLine:#A9C6E6;
  --felt:#236049;--feltEdge:#3B3A2E;--seat:#F7F8F9;--danger:#A33A3A;--cellEmpty:#E3E6EA;--cellText:#5E6571;
  --shadow:rgba(20,24,30,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181C;--surface:#1E2126;--surface2:#23262C;--line:#33373E;--text:#ECEAE4;--muted:#A3A7AE;
    --accent:#F0A04B;--fill:#F0A04B;--info:#8CC0F0;--infoBg:#1E2A38;--infoLine:#2D4A66;
    --felt:#1F4A3C;--feltEdge:#2B2F26;--seat:#23262C;--danger:#E7A3A3;--cellEmpty:#1E2126;--cellText:#8A8F97;
    --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#16181C;--surface:#1E2126;--surface2:#23262C;--line:#33373E;--text:#ECEAE4;--muted:#A3A7AE;
  --accent:#F0A04B;--fill:#F0A04B;--info:#8CC0F0;--infoBg:#1E2A38;--infoLine:#2D4A66;
  --felt:#1F4A3C;--feltEdge:#2B2F26;--seat:#23262C;--danger:#E7A3A3;--cellEmpty:#1E2126;--cellText:#8A8F97;
  --shadow:rgba(0,0,0,.45);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--info)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1280px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{font-weight:700;font-size:17px;text-decoration:none;color:var(--text)}
.avatar{width:34px;height:34px;border-radius:50%;background:#2D6FAF;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 56px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--fill);border-color:var(--fill);color:#1B1D21;font-weight:700}
.btn-solid{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:700}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-block{width:100%;min-height:52px;font-size:15px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:22px;line-height:1.45;margin:4px 0 0}
h2{font-size:16px;margin:0}
/* list */
.list-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:16px}
.tab{min-height:48px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;padding:0 2px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--fill)}
.filters{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0}
.fgroup{display:flex;align-items:center;gap:8px;overflow-x:auto;max-width:100%}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.post-title{font-size:16px;font-weight:700;line-height:1.55;flex-grow:1}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2)}
.b-flop{color:#2E7D55}.b-turn{color:#9A520D}.b-river{color:#6A4FB0}.b-pf{color:var(--muted)}
:root[data-theme="dark"] .b-flop{color:#9FD3B5}:root[data-theme="dark"] .b-turn{color:#F0C48B}:root[data-theme="dark"] .b-river{color:#C5B3F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-flop{color:#9FD3B5}:root:not([data-theme="light"]) .b-turn{color:#F0C48B}:root:not([data-theme="light"]) .b-river{color:#C5B3F0}}
.post-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
/* layout */
.cols{display:grid;gap:24px;margin-top:12px}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,500px)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
/* table */
.table-wrap{position:relative;width:100%;aspect-ratio:740/400;container-type:inline-size}
.felt{position:absolute;left:5%;top:7%;width:90%;height:86%;border-radius:999px;background:var(--felt);box-shadow:inset 0 0 0 1.3cqw var(--feltEdge),inset 0 0 6cqw rgba(0,0,0,.35)}
.seat{position:absolute;width:17%;height:19%;border-radius:1.6cqw;background:var(--seat);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;line-height:1.15;transition:opacity .25s}
.seat .pos{font-weight:700;font-size:2.2cqw}
.seat .tag{font-size:1.6cqw;font-weight:500;margin-left:.6cqw}
.seat .stk{font-size:1.75cqw;color:var(--muted)}
.seat .last{font-size:1.6cqw;color:var(--muted)}
.seat.folded{opacity:.4}
.seat.host{border-color:var(--fill)}
.seat.host .tag{color:var(--accent)}
.seat.viewer{border:2px solid var(--info)}
.seat.viewer .tag{color:var(--info)}
.seat.acting{box-shadow:0 0 0 .6cqw var(--info)}
.hc{display:flex;gap:.4cqw;--cw:3.1cqw;margin-top:.2cqw}
.pc{width:var(--cw,40px);height:calc(var(--cw,40px)*1.38);border-radius:calc(var(--cw,40px)*.14);background:#F7F5F0;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;line-height:1;font-size:calc(var(--cw,40px)*.46);box-shadow:0 0 0 1px rgba(0,0,0,.18);flex-shrink:0}
.pc.back{background:#7A2E2E;box-shadow:inset 0 0 0 calc(var(--cw,40px)*.1) #F7F5F0}
.pot{position:absolute;left:50%;top:36.5%;transform:translate(-50%,-50%);font-size:2cqw;color:#D7E4DC;white-space:nowrap}
.board{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);display:flex;gap:.8cqw;--cw:6cqw}
.betchip{position:absolute;transform:translate(-50%,-50%);padding:.35cqw 1.2cqw;border-radius:999px;background:#F0A04B;color:#1B1D21;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:1.8cqw;white-space:nowrap}
.result-note{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);font-size:1.8cqw;color:#D7E4DC;white-space:nowrap}
.s-s{color:#1B1D21}.s-h{color:#C0392B}.s-d{color:#1F5FB0}.s-c{color:#1E7A46}
.txt-s{color:var(--text)}.txt-h{color:#D14A3C}.txt-d{color:#3D7FD1}.txt-c{color:#3B9A64}
/* replay */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls .btn{padding:0 12px;font-size:13px}
.prog{flex-grow:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;background:var(--info)}
.log{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lg-col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lg-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.lg-a{font-size:13px;line-height:1.85;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lg-a.now{font-weight:700}
.lg-p{font-weight:700;min-width:32px}
.lg-tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--infoBg);color:var(--info);border:1px solid var(--infoLine)}
.lg-a.actual{color:var(--info);font-weight:700}
.lg-next{grid-column:1/-1;font-weight:700;color:var(--info);font-size:14px}
details.logbox summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-size:14px}
/* answer panel */
.prompt{background:var(--infoBg);border:1px solid var(--infoLine);border-radius:10px;padding:12px 14px}
.prompt .lead{font-size:13px;color:var(--muted)}
.prompt .q{font-size:16px;font-weight:700;line-height:1.5;margin:2px 0}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.tool{min-height:54px;border-radius:9px;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.tool .n{font-size:13px;font-weight:700}
.tool .v{font-size:11px;font-family:'IBM Plex Mono',ui-monospace,monospace}
.tool[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.tool.eraser{background:var(--cellEmpty);border:1px dashed var(--muted);color:var(--text)}
.disabled-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.disabled-acts button{min-height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);opacity:.55;font-size:12px}
.sizes{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:13px;color:var(--muted)}
.sizes label{display:flex;align-items:center;gap:6px}
.num{width:78px;min-height:40px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px}
.rgrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.rc{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:var(--cellEmpty);color:var(--cellText);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:clamp(8px,2.35vw,12px);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;position:relative;overflow:hidden;line-height:1}
.rc.painted{border-color:transparent}
.rc .segs{position:absolute;inset:0;display:flex}
.rc .segs span{display:block;height:100%;flex-shrink:0}
.rc .lb{position:relative;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.95),0 0 1px rgba(0,0,0,.9)}
.rc.agg{border:none}
.rc.actual{box-shadow:inset 0 0 0 2px #F7F5F0,inset 0 0 0 3px #1B1D21}
.rc.sel{outline:2px solid var(--info);outline-offset:1px;z-index:1}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick .btn{padding:0 6px;font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.stats span.i{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.dot.none{background:var(--cellEmpty);border:1px solid var(--muted)}
.err{color:var(--danger);font-size:13px;font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.6}
/* result */
.segtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.segtabs button{flex:1 1 0;min-height:44px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.segtabs button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.totbar{height:14px;border-radius:4px;overflow:hidden;display:flex;background:var(--cellEmpty)}
.totbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend .i{display:inline-flex;align-items:center;gap:6px}
.detail{display:flex;flex-direction:column;gap:6px}
.detail .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px;font-size:13px}
.actual-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cards-inline{display:flex;gap:4px;--cw:30px}
/* create */
.create{display:grid;gap:16px;margin-top:12px}
@media (min-width:1100px){.create{grid-template-columns:360px minmax(0,1fr) 340px;align-items:start}}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:4px}
.seg button{flex:1 1 0;min-height:44px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select,.tinput{min-height:42px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}
.field input:disabled{opacity:.45}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 88px;align-items:center;gap:8px;min-height:44px}
.prow label.hero{display:flex;align-items:center;gap:6px;font-size:13px;min-height:44px;cursor:pointer}
.slot{--cw:40px;border:1px dashed var(--muted);border-radius:6px;width:var(--cw);height:calc(var(--cw)*1.38);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:16px}
.slot:disabled{opacity:.35;cursor:not-allowed}
.slotbtn{padding:0;border:none;background:none;cursor:pointer;--cw:40px;border-radius:6px}
.slotbtn:disabled{cursor:default}
.boardrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nextbox{border:1px solid var(--infoLine);background:var(--infoBg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.actbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.actbtns .btn{font-weight:700}
.a-fold{background:#6B7280;border-color:#6B7280;color:#fff}
.a-check{background:#3C7D5A;border-color:#3C7D5A;color:#fff}
.a-call{background:#2D6FAF;border-color:#2D6FAF;color:#fff}
.a-bet{background:#F0A04B;border-color:#F0A04B;color:#1B1D21}
.spotopt{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.spotopt.on{border-color:var(--info);background:var(--infoBg)}
.errlist{margin:0;padding-left:18px;color:var(--danger);font-size:13px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom,0px)}
.picker{display:flex;flex-direction:column;gap:4px}
.picker .row{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.picker button{min-height:44px;padding:0;border-radius:5px;border:1px solid rgba(0,0,0,.15);background:#F7F5F0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;cursor:pointer;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.picker button:disabled{opacity:.2;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 8px 24px var(--shadow)}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 32px;display:flex;justify-content:flex-end}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:44px;font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sizebox{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sizerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sizerow .chip{min-height:38px;padding:0 12px}
.range{flex:1 1 140px;min-width:120px;accent-color:#F0A04B;height:32px}
.quick2{display:flex;gap:6px;align-items:center}
.iconbtn{width:52px;padding:0}
.prow{grid-template-columns:44px minmax(0,1fr) 92px 64px}
.handbtn{display:flex;gap:4px;align-items:center;justify-content:center;min-height:48px;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;--cw:28px}
.handbtn.on{border:2px solid var(--info);background:var(--infoBg)}
.pc.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--muted);opacity:.5}
.pc.partial{background:#F7F5F0;color:#1B1D21;opacity:.75}
.kp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.kp{position:relative;background:#333;padding:10px;border-radius:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:54px;gap:8px;touch-action:none;user-select:none;-webkit-user-select:none;width:100%}
.kp .key.flick{grid-row:span 2;height:auto}
.kp .key{background:#666;color:#fff;font-size:1.25rem;font-weight:700;border:none;border-radius:8px;height:54px;display:flex;justify-content:center;align-items:center;cursor:pointer;position:relative;font-family:inherit}
.kp .key:active{background:#777}
.kp .key.blank{visibility:hidden}
.kp .suit{font-size:1.5rem}
.suit.spade{color:#000}.suit.heart{color:#ff5252}.suit.diamond{color:#448aff}.suit.club{color:#69f0ae}
.flick-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1px;height:1px;display:none;z-index:100}
.flick-popup.visible{display:block}
.flick-key{position:absolute;width:56px;height:56px;background:#fdfdfd;color:#333;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;justify-content:center;align-items:center;font-size:1.1rem;font-weight:700;transition:transform .1s ease,background-color .1s ease}
.flick-center{transform:translate(-50%,-50%)}.flick-top{transform:translate(-50%,-165%)}.flick-right{transform:translate(65%,-50%)}.flick-bottom{transform:translate(-50%,65%)}.flick-left{transform:translate(-165%,-50%)}
.flick-key.highlight{background:#337ab7;color:#fff;transform:scale(1.1) translate(-45%,-45%)}
.flick-top.highlight{transform:scale(1.1) translate(-45%,-160%)}.flick-right.highlight{transform:scale(1.1) translate(60%,-45%)}.flick-bottom.highlight{transform:scale(1.1) translate(-45%,60%)}.flick-left.highlight{transform:scale(1.1) translate(-160%,-45%)}
.kp-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#333;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.45);max-width:440px;margin:0 auto}
.kp-sheet[hidden]{display:none}
html.forcesp .kp-sheet{max-width:390px}
.kp-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0 14px;color:#fff}

<body>
<div id="shell">
<header class="hdr"><div class="hdr-in"><a class="brand" href="#/">[アプリ名]</a><div style="display:flex;align-items:center;gap:10px"><button class="btn infobtn" type="button" data-act="info" aria-label="インフォメーション"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor"/></svg></button><button class="btn sp-toggle" type="button" id="spToggle" data-act="sptoggle">スマホ表示で見る</button><span class="small muted hdr-note">デモユーザーでログイン中</span><div class="avatar" aria-hidden="true">S</div></div></div></header>
<main id="app" class="wrap"></main>
<div class="foot"><button class="linkbtn" type="button" data-act="reset">デモデータを最初の状態に戻す</button></div>
</div>

<div id="modal-root"></div>
<script>
(function(){
'use strict';
var POS=['UTG','HJ','CO','BTN','SB','BB'];
var POST=['SB','BB','UTG','HJ','CO','BTN'];
var STREETS=['pf','flop','turn','river'];
var SN={pf:'プリフロップ',flop:'フロップ',turn:'ターン',river:'リバー'};
var NEED={pf:0,flop:3,turn:4,river:5};
var RANKS='AKQJT98765432';
var SUITS=['s','h','d','c'];
var SSYM={s:'♠',h:'♥',d:'♦',c:'♣'};
var COL={fold:'#6B7280',check:'#3C7D5A',call:'#2D6FAF',s1:'#F0A04B',s2:'#9C4A16'};
var TXT={fold:'#FFFFFF',check:'#FFFFFF',call:'#FFFFFF',s1:'#1B1D21',s2:'#FFFFFF'};
var KORDER=['fold','check','call','s1','s2'];
var STORE='spotapp.proto.v2';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r2(n){return Math.round(n*100)/100;}
function nf(n){return String(parseFloat(r2(n).toFixed(2)));}
function clone(o){return JSON.parse(JSON.stringify(o));}
function hsh(s){var h=17;for(var i=0;i<s.length;i++){h=(h*131+s.charCodeAt(i)*7)%10007;}return (h%997)/997;}
var LABELS=[];
for(var i=0;i<13;i++){for(var j=0;j<13;j++){LABELS.push(i===j?RANKS[i]+RANKS[j]:(i<j?RANKS[i]+RANKS[j]+'s':RANKS[j]+RANKS[i]+'o'));}}
function combos(l){return l.length===2?6:(l.charAt(2)==='s'?4:12);}
function comboLabel(c){var a=RANKS.indexOf(c[0][0]),b=RANKS.indexOf(c[1][0]);if(a===b)return c[0][0]+c[1][0];var hi=a<b?c[0]:c[1],lo=a<b?c[1]:c[0];return hi[0]+lo[0]+(c[0][1]===c[1][1]?'s':'o');}
function cardHTML(c,extra){return '<span class="pc s-'+c[1]+(extra?' '+extra:'')+'"><span>'+c[0]+'</span><span>'+SSYM[c[1]]+'</span></span>';}
function backHTML(){return '<span class="pc back"></span>';}
function cardTxt(c){return '<span class="txt-'+c[1]+'">'+c[0]+SSYM[c[1]]+'</span>';}

/* ---------- engine ---------- */
function initState(h){
  var st={street:'pf',pot:0,bets:{},stacks:{},folded:{},allin:{},acted:{},cur:+h.bb,minR:+h.bb,bb:+h.bb,lastPos:'BB',last:{}};
  POS.forEach(function(p){st.stacks[p]=+h.stacks[p];st.bets[p]=0;});
  if(+h.ante>0){POS.forEach(function(p){var a=Math.min(+h.ante,st.stacks[p]);st.stacks[p]=r2(st.stacks[p]-a);st.pot=r2(st.pot+a);});}
  function post(p,v){var a=Math.min(v,st.stacks[p]);st.stacks[p]=r2(st.stacks[p]-a);st.bets[p]=a;if(st.stacks[p]<=0)st.allin[p]=true;}
  post('SB',+h.sb);post('BB',+h.bb);
  return st;
}
function advance(st){
  POS.forEach(function(p){st.pot=r2(st.pot+st.bets[p]);st.bets[p]=0;});
  st.street=STREETS[STREETS.indexOf(st.street)+1];st.cur=0;st.minR=st.bb;st.acted={};st.lastPos=null;st.last={};
}
function apply(st,a){
  while(st.street!==a.street&&STREETS.indexOf(st.street)<STREETS.indexOf(a.street)){advance(st);}
  var p=a.pos,b=st.bets[p];
  if(a.type==='call'){var amt=Math.min(st.cur-b,st.stacks[p]);st.stacks[p]=r2(st.stacks[p]-amt);st.bets[p]=r2(b+amt);}
  else if(a.type==='bet'||a.type==='raise'){
    var add=Math.min(a.to-b,st.stacks[p]);st.stacks[p]=r2(st.stacks[p]-add);var nt=r2(b+add);var rs=r2(nt-st.cur);
    if(rs>=st.minR)st.minR=rs;
    if(nt>st.cur){st.cur=nt;st.acted={};}
    st.bets[p]=nt;
  } else if(a.type==='fold'){st.folded[p]=true;}
  if(st.stacks[p]<=0.0001&&a.type!=='fold'){st.stacks[p]=0;st.allin[p]=true;}
  st.acted[p]=true;st.lastPos=p;st.last[p]=a;
  return st;
}
function stateAt(h,k){var st=initState(h);for(var i=0;i<k;i++)apply(st,h.actions[i]);return st;}
function stateBefore(h,j){var st=stateAt(h,j);var a=h.actions[j];while(st.street!==a.street)advance(st);return st;}
function activeP(st){return POS.filter(function(p){return !st.folded[p];});}
function canActP(st){return POS.filter(function(p){return !st.folded[p]&&!st.allin[p];});}
function nextActor(st){
  if(activeP(st).length<=1)return null;
  var ca=canActP(st);if(ca.length===0)return null;
  if(ca.length===1&&st.bets[ca[0]]>=st.cur-0.0001)return null;
  var order=st.street==='pf'?POS:POST;var idx=st.lastPos?order.indexOf(st.lastPos):-1;
  for(var k=1;k<=6;k++){var p=order[(idx+k)%6];if(ca.indexOf(p)>=0&&(!st.acted[p]||st.bets[p]<st.cur-0.0001))return p;}
  return null;
}
function legal(st,p){
  var facing=r2(st.cur-st.bets[p]),stack=st.stacks[p];
  var others=canActP(st).filter(function(x){return x!==p;}).length;
  var maxTo=r2(st.bets[p]+stack);
  if(facing>0){return {facing:facing,fold:true,check:false,call:Math.min(facing,stack),bet:false,raise:stack>facing&&others>0,minTo:Math.min(r2(st.cur+st.minR),maxTo),maxTo:maxTo};}
  return {facing:0,fold:false,check:true,call:0,bet:stack>0&&others>0,raise:false,minTo:Math.min(st.bb,maxTo),maxTo:maxTo};
}
function actText(a){
  if(a.type==='fold')return 'フォールド';if(a.type==='check')return 'チェック';if(a.type==='call')return 'コール';
  return (a.type==='bet'?'ベット ':'レイズ ')+nf(a.to);
}

/* ---------- spots ---------- */
function spotStop(post){var h=post.hand;for(var j=post.spotIndex+1;j<h.actions.length;j++){if(h.actions[j].pos===post.answerSeat)return j;}return -1;}
function potAfterCall(st,lg){var t=st.pot;POS.forEach(function(x){t+=st.bets[x];});return r2(t+lg.call);}
function toFromPct(st,lg,pct){var base=potAfterCall(st,lg);var to=lg.facing>0?r2(st.cur+pct/100*base):r2(pct/100*base);return Math.min(lg.maxTo,Math.max(lg.minTo,to));}
function pctFromTo(st,lg,to){var base=potAfterCall(st,lg);if(!base)return 0;return lg.facing>0?(to-st.cur)/base*100:to/base*100;}
function spotInfo(post){
  var h=post.hand,stop=spotStop(post),st=stateBefore(h,stop),seat=post.answerSeat,lg=legal(st,seat);
  var canS=lg.facing>0?lg.raise:lg.bet;
  var keys=lg.facing>0?['fold','call']:['check'];if(canS)keys=keys.concat(['s1']);
  return {h:h,stop:stop,st:st,seat:seat,lg:lg,keys:keys,def:{s1:nf(toFromPct(st,lg,50))},actual:h.actions[stop],street:h.actions[stop].street,hostAct:h.actions[post.spotIndex]};
}
function kname(k,facing){
  if(k==='fold')return 'フォールド';if(k==='check')return 'チェック';if(k==='call')return 'コール';
  return facing>0?'レイズ':'ベット';
}
function actualKey(a){if(a.type==='bet'||a.type==='raise')return 's';return a.type;}
function oppCards(post){var c=post.hand.showdown&&post.hand.showdown[post.answerSeat];return Array.isArray(c)?c:null;}
function seedBase(seed){var b={};Object.keys(seed.base).forEach(function(k){seed.base[k].split(' ').forEach(function(l){if(l)b[l]=(k==='s2'?'s1':k);});});return b;}
function seedCell(l,base,keys,N){
  var b=base[l],h=hsh(l),g=hsh(l+'#');var reach=b?0.55+0.43*h:0.18*h*h;var d={},s=0;
  keys.forEach(function(k){d[k]=0.03+0.07*hsh(l+k);});
  if(b&&d[b]!==undefined)d[b]+=0.6+0.3*g;else d[keys[0]]+=0.5;
  keys.forEach(function(k){s+=d[k];});keys.forEach(function(k){d[k]/=s;});
  return {n:Math.round(reach*N),d:d};
}
function hostPaint(post,keys){
  if(post.hostAnswer)return post.hostAnswer.paint;
  if(!post.seed)return null;
  var base=seedBase(post.seed),p={};
  Object.keys(base).forEach(function(l){var b=base[l];if(hsh(l+'x')<0.08)return;if(hsh(l+'host')<0.18){var ks=keys.filter(function(k){return k!==b;});p[l]=ks[Math.floor(hsh(l+'y')*ks.length)]||b;}else p[l]=b;});
  return p;
}
function totalOf(post){return (post.seed?post.seed.N:0)+post.answers.length;}
function aggregate(post,keys){
  var cells={},total=0;
  LABELS.forEach(function(l){var c={};keys.forEach(function(k){c[k]=0;});cells[l]={n:0,c:c};});
  if(post.seed){total+=post.seed.N;var base=seedBase(post.seed);LABELS.forEach(function(l){var s=seedCell(l,base,keys,post.seed.N);cells[l].n+=s.n;keys.forEach(function(k){cells[l].c[k]+=s.d[k]*s.n;});});}
  post.answers.forEach(function(a){total++;LABELS.forEach(function(l){var m=toMix(a.paint[l]);if(!m)return;cells[l].n++;Object.keys(m).forEach(function(k){var kk=k==='s2'?'s1':k;if(cells[l].c[kk]!==undefined)cells[l].c[kk]+=m[k];});});});
  return {total:total,cells:cells};
}
function myAnswer(post){if(post.author==='me')return post.hostAnswer;for(var i=0;i<post.answers.length;i++){if(post.answers[i].user==='me')return post.answers[i];}return null;}

/* ---------- seed data ---------- */
function A(street,pos,type,to){var a={street:street,pos:pos,type:type};if(to!=null)a.to=to;return a;}
function stacks100(){return {UTG:100,HJ:100,CO:100,BTN:100,SB:100,BB:100};}
function seedDB(){
  var now=Date.now();
  return [
    {id:'s1',author:'other',createdAt:now-2*3600e3,title:'K83レインボーのターン2バレル、BBの継続レンジは？',
     hand:{fmt:'cash',sb:0.5,bb:1,ante:0,rake:5,stacks:stacks100(),hero:'BTN',heroCards:['Ad','Kd'],board:['Kh','8d','3c','2s','7h'],
       actions:[A('pf','UTG','fold'),A('pf','HJ','fold'),A('pf','CO','fold'),A('pf','BTN','raise',2.5),A('pf','SB','fold'),A('pf','BB','call'),
         A('flop','BB','check'),A('flop','BTN','bet',1.8),A('flop','BB','call'),
         A('turn','BB','check'),A('turn','BTN','bet',6.5),A('turn','BB','call'),
         A('river','BB','check'),A('river','BTN','bet',15),A('river','BB','call')],
       showdown:{BB:['Ks','Js']}},
     spotIndex:10,answerSeat:'BB',answers:[],hostAnswer:null,
     seed:{N:36,base:{call:'KQs KJs KTs K9s K7s K6s K5s K4s KQo KJo KTo K9o QQ JJ TT 99 98s 87s 76s 65s A8s Q8s J8s T8s A3s',s1:'88 33 22 K8s K3s K2s',s2:'A5s A4s 54s',fold:'77 66 55 44 QJs QTs JTs Q9s J9s T9s 97s A9s AQo AJo ATo K8o'}}},
    {id:'s2',author:'other',createdAt:now-5*3600e3,title:'シングルレイズドポットのリバーオーバーベット、ブラフキャッチは何で？',
     hand:{fmt:'cash',sb:0.5,bb:1,ante:0,rake:5,stacks:stacks100(),hero:'CO',heroCards:['Th','8h'],board:['Qh','9c','4d','4s','2h'],
       actions:[A('pf','UTG','fold'),A('pf','HJ','fold'),A('pf','CO','raise',2.5),A('pf','BTN','fold'),A('pf','SB','fold'),A('pf','BB','call'),
         A('flop','BB','check'),A('flop','CO','bet',1.8),A('flop','BB','call'),

    {id:'s3',author:'other',createdAt:now-26*3600e3,title:'バブル直前、BBのフロップのリードにHJはどう返す？',
     hand:{fmt:'mtt',sb:0.5,bb:1,ante:0.125,rake:0,stacks:{UTG:30,HJ:22,CO:45,BTN:18,SB:26,BB:24},hero:'BB',heroCards:['Jc','8c'],board:['Jh','7s','3d','2c','9d'],
       actions:[A('pf','UTG','fold'),A('pf','HJ','raise',2.1),A('pf','CO','fold'),A('pf','BTN','fold'),A('pf','SB','fold'),A('pf','BB','call'),
         A('flop','BB','bet',3),A('flop','HJ','call'),
         A('turn','BB','check'),A('turn','HJ','check'),
         A('river','BB','check'),A('river','HJ','check')],

  var post=getPost(ans.id),info=spotInfo(post),sums={},none=0;
  info.keys.forEach(function(k){sums[k]=0;});
  LABELS.forEach(function(l){var m=ans.paint[l],c=combos(l);if(m){info.keys.forEach(function(k){sums[k]+=c*(m[k]||0);});}else none+=c;});
  var bar='<div class="totbar">'+info.keys.map(function(k){return '<span style="width:'+(sums[k]/13.26).toFixed(2)+'%;background:'+COL[k]+'"></span>';}).join('')+'</div>';
  var h='<div class="stats"><span>1326 combos</span>'+info.keys.map(function(k){return '<span class="i"><span class="dot" style="background:'+COL[k]+'"></span>'+kname(k,info.lg.facing)+' <span class="mono" style="color:var(--text)">'+(sums[k]/13.26).toFixed(1)+'%</span></span>';}).join('');
  h+='<span class="i"><span class="dot none"></span>レンジ外 <span class="mono" style="color:var(--text)">'+(none/13.26).toFixed(1)+'%</span></span></div>';
  box.innerHTML='<div class="stack" style="gap:6px">'+bar+h+'</div>';
}
function paintCell(l,mode){
  if(mode==='erase')delete ans.paint[l];else ans.paint[l]=brushMix();
  var el=document.querySelector('#pgrid [data-l="'+l+'"]');if(el)styleCell(el,ans.paint[l]);
}
function decideMode(l){return (ans.mode==='erase'||mixEq(ans.paint[l],brushMix()))?'erase':'paint';}
var drag=null;
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest('[data-grid="paint"]');if(!g||!ans)return;
  var c=e.target.closest('[data-l]');if(!c)return;
  e.preventDefault();
  var l=c.dataset.l,prev=ans.paint[l]?clone(ans.paint[l]):null,mode=decideMode(l);
  pushHist();drag={mode:mode,id:e.pointerId,last:l,start:l,moved:false,x:e.clientX,y:e.clientY,prev:prev};paintCell(l,mode);
  drag.timer=setTimeout(function(){
    if(!drag||drag.moved)return;
    ans.paint=ans.hist.pop()||ans.paint;if(prev)ans.paint[l]=prev;paintAll();updateHistBtns();
    if(prev){var b={};spotInfo(getPost(ans.id)).keys.forEach(function(k){b[k]=Math.round((prev[k]||0)*100);});ans.brush=b;ans.mode='brush';updateBrushVisual();toast(l+'：'+mixText(prev,spotInfo(getPost(ans.id)).lg.facing));}
    else toast(l+'：レンジ外');
    drag.picked=true;
  },480);
  try{g.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id||drag.picked)return;
  if(Math.abs(e.clientX-drag.x)>6||Math.abs(e.clientY-drag.y)>6)drag.moved=true;
  var el=document.elementFromPoint(e.clientX,e.clientY);var c=el&&el.closest?el.closest('#pgrid [data-l]'):null;
  if(c&&c.dataset.l!==drag.last){drag.moved=true;drag.last=c.dataset.l;paintCell(c.dataset.l,drag.mode);}
});
function endDrag(e){if(drag&&(!e||e.pointerId===drag.id)){clearTimeout(drag.timer);drag=null;renderPStats();}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
  if(!ans)return;var c=e.target.closest&&e.target.closest('#pgrid [data-l]');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();var l=c.dataset.l;pushHist();paintCell(l,decideMode(l));renderPStats();}
  var h=e.target.closest&&e.target.closest('.mh');
  if(h&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();moveHandle(+h.dataset.h,(+h.getAttribute('aria-valuenow'))+(e.key==='ArrowLeft'?-5:5));}
});
/* mix bar handles */
function moveHandle(i,pct){
  var keys=spotInfo(getPost(ans.id)).keys,cum=[],acc=0;
  keys.forEach(function(k){acc+=ans.brush[k];cum.push(acc);});
  var lo=i>0?cum[i-1]:0,hi=cum[i+1];pct=Math.max(lo,Math.min(hi,Math.round(pct/5)*5));cum[i]=pct;
  var prevC=0;keys.forEach(function(k,j){ans.brush[k]=cum[j]-prevC;prevC=cum[j];});
  ans.mode='brush';updateBrushVisual();
}
var hdrag=null;
document.addEventListener('pointerdown',function(e){

/* ---------- replay (answer & result) ---------- */
function replayCtx(mode){
  var post=getPost(mode==='answer'?ans.id:res.id),info=spotInfo(post),h=post.hand;
  var max=mode==='answer'?info.stop:h.actions.length;var s=mode==='answer'?ans.step:res.step;
  return {post:post,info:info,h:h,max:max,s:s};
}
function renderReplay(mode){
  var c=replayCtx(mode),h=c.h,info=c.info,s=c.s,st,boardCount,note='';
  if(mode==='answer'&&s===info.stop)st=info.st;else st=stateAt(h,s);
  boardCount=NEED[st.street];
  var atEnd=mode==='result'&&s===h.actions.length;
  if(atEnd){st=clone(st);if(activeP(st).length>1){boardCount=h.board.length;note='ショーダウン';}else{note=activeP(st)[0]+' ポット獲得';}POS.forEach(function(p){st.pot=r2(st.pot+st.bets[p]);st.bets[p]=0;});}
  var acting=s<c.max?h.actions[s].pos:(mode==='answer'?info.seat:null);
  var html=tableHTML(h,st,{viewer:info.seat,viewerTag:mode==='answer'?(c.post.author==='me'?'回答席':'あなた'):'回答席',showHost:mode==='result',reveal:atEnd,acting:acting,boardCount:boardCount,note:note});
  html+='<div class="controls"><button class="btn" type="button" data-act="rp" data-v="first" data-m="'+mode+'">最初から</button><button class="btn" type="button" data-act="rp" data-v="back" data-m="'+mode+'"'+(s<=0?' disabled':'')+'>1手戻る</button><button class="btn" type="button" data-act="rp" data-v="play" data-m="'+mode+'">'+(timer?'一時停止':'再生')+'</button><button class="btn" type="button" data-act="rp" data-v="fwd" data-m="'+mode+'"'+(s>=c.max?' disabled':'')+'>1手進む</button>';
  html+='<div class="prog"><div class="bar"><div style="width:'+(c.max?s/c.max*100:100)+'%"></div></div><div class="small muted">'+s+' / '+c.max+' 手目'+'</div></div></div>';
  var logOpt=mode==='answer'?{spot:post_spot(c),highlightLast:true,prompt:s===c.max?'▶ '+info.seat+' to act':''}:{spot:c.post.spotIndex,actual:info.stop,highlightLast:s<c.max};
  var lg=logHTML(h,s,logOpt);
  html+=(isSP()||window.innerWidth<980)?'<details class="logbox"'+(mode==='result'?' open':'')+'><summary>ハンドヒストリー</summary>'+lg+'</details>':lg;
  if(mode==='result'&&s===c.max){
    var sd=h.showdown||{},lines=[];
    Object.keys(sd).forEach(function(p){lines.push(p+' '+(Array.isArray(sd[p])?sd[p].map(cardTxt).join(''):'マック'));});
    lines.unshift(h.hero+' '+h.heroCards.map(cardTxt).join(''));
    html+='<div class="small muted">'+(activeP(stateAt(h,h.actions.length)).length>1?'ショーダウン：':'')+lines.join(' ／ ')+'</div>';
  }
  var box=document.getElementById('replay');if(box)box.innerHTML=html;
}
function post_spot(c){return c.post.spotIndex;}
function setStep(mode,v){if(mode==='answer')ans.step=v;else res.step=v;}
function playReplay(mode){
  stopTimer();var c=replayCtx(mode);if(c.s>=c.max)setStep(mode,0);
  timer=setInterval(function(){var c2=replayCtx(mode);if(c2.s>=c2.max){stopTimer();renderReplay(mode);return;}setStep(mode,c2.s+1);if(c2.s+1>=c2.max)stopTimer();renderReplay(mode);},650);
  renderReplay(mode);
}

  }).join('');

var draft=null;
function newDraft(){return {fmt:'cash',sb:'0.5',bb:'1',ante:'0',rake:'5',stacks:{UTG:'100',HJ:'100',CO:'100',BTN:'100',SB:'100',BB:'100'},hero:'BTN',hands:{UTG:'',HJ:'',CO:'',BTN:'',SB:'',BB:''},kpTarget:'BTN',board:[],actions:[],spotIndex:null,answerSeat:null,title:'',amount:'',errors:[],spStep:0};}
function handCards(str){var out=[];for(var i=0;i+1<str.length;i+=2){var c=str.substr(i,2);if(SUITS.indexOf(c[1])>=0)out.push(c);}return out;}
function knownHands(){var o={};POS.forEach(function(p){var c=handCards(draft.hands[p]||'');if(c.length===2)o[p]=c;});return o;}
function dHand(){var kh=knownHands(),sd={};POS.forEach(function(p){if(p!==draft.hero&&kh[p])sd[p]=kh[p];});
  return {fmt:draft.fmt,sb:+draft.sb,bb:+draft.bb,ante:+draft.ante||0,rake:draft.fmt==='mtt'?0:(+draft.rake||0),stacks:(function(){var s={};POS.forEach(function(p){s[p]=+draft.stacks[p];});return s;})(),hero:draft.hero,heroCards:kh[draft.hero]||[],board:draft.board.slice(),actions:draft.actions.slice(),showdown:sd};}
function draftStatus(){
  var h=dHand(),st=stateAt(h,h.actions.length);
  if(activeP(st).length<=1)return {kind:'over',st:st};
  var nx=nextActor(st);if(nx)return {kind:'act',st:st,p:nx};
  if(canActP(st).length<=1){if(draft.board.length<5)return {kind:'board',st:st,need:5,runout:true};return {kind:'showdown',st:st};}
  if(st.street==='river')return {kind:'showdown',st:st};
  var ns=STREETS[STREETS.indexOf(st.street)+1];
  if(draft.board.length<NEED[ns])return {kind:'board',st:st,need:NEED[ns],street:ns};
  var adv=clone(st);advance(adv);var p=nextActor(adv);return {kind:'act',st:adv,p:p};
}
function usedCards(exceptP){var u=draft.board.slice();POS.forEach(function(p){if(p!==exceptP)u=u.concat(handCards(draft.hands[p]||''));});return u;}
function spotCands(){
  var res2=[];draft.actions.forEach(function(a,i){if(a.pos!==draft.hero||a.type==='fold')return;var seats=[];for(var j=i+1;j<draft.actions.length;j++){var b=draft.actions[j];if(b.pos===draft.hero)break;if(seats.indexOf(b.pos)<0)seats.push(b.pos);}if(seats.length)res2.push({i:i,a:a,seats:seats});});return res2;
}

function updateHands(){
  POS.forEach(function(p){var b=document.querySelector('[data-handbtn="'+p+'"]');if(b){b.innerHTML=handSlotsHTML(draft.hands[p]||'');var on=draft.kpTarget===p;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));}});

function kpInput(v){
  if(!draft)return;var p=draft.kpTarget;if(!p)return;var s=draft.hands[p]||'';
  if(v==='C'){s='';}
  else if(v==='BS'){s=s.slice(0,-1);}
  else if(SUITS.indexOf(v)>=0){
    if(s.length%2===0){toast(s.length>=4?'ハンドは2枚までです':'先にランクを選んでください');return;}
    var r=s.slice(-1);if(r==='1')r='A';var card=r+v;
    var used=usedCards(p).concat(handCards(s));
    if(used.indexOf(card)>=0){toast(r+SSYM[v]+' はすでに使われています');return;}
    s=s.slice(0,-1)+card;
  } else {
    if(s.length%2===1){
      var last=s.slice(-1);
      if(last==='1'&&v==='0')s=s.slice(0,-1)+'T';
      else if(v==='0'){toast('0 は 1 のあとに押すと T（10）になります');return;}
      else s=s.slice(0,-1)+v;
    } else {
      if(s.length>=4){toast('ハンドは2枚までです。C で消せます');return;}
      if(v==='0'){toast('0 は 1 のあとに押すと T（10）になります');return;}
      s+=v;
    }
  }
  draft.hands[p]=s;updateHands();
}
var FLICK={rank:['A','K','Q','J','T'],suit:['s','h','d','c','']};

function flickCreate(){
  if(!fl||fl.popup)return;var key=fl.key,kind=fl.kind,pop=document.createElement('div');pop.className='flick-popup';
  FLICK[kind].forEach(function(v,i){if(!v)return;var d=document.createElement('div');d.className='flick-key flick-'+FDIR[i];d.dataset.value=v;d.dataset.direction=FDIR[i];d.innerHTML=flickLabel(kind,v);pop.appendChild(d);});
  key.appendChild(pop);pop.style.visibility='hidden';pop.classList.add('visible');
  var box=document.getElementById('kp').getBoundingClientRect(),minX=1e9,minY=1e9,maxX=0,maxY=0;
  pop.querySelectorAll('.flick-key').forEach(function(k){var r=k.getBoundingClientRect();minX=Math.min(minX,r.left);minY=Math.min(minY,r.top);maxX=Math.max(maxX,r.right);maxY=Math.max(maxY,r.bottom);});
  var ox=0,oy=0,m=8;if(maxX>box.right)ox=box.right-maxX-m;if(minX<box.left)ox=box.left-minX+m;if(maxY>box.bottom)oy=box.bottom-maxY-m;if(minY<box.top)oy=box.top-minY+m;
  pop.style.transform='translate(calc(-50% + '+ox+'px), calc(-50% + '+oy+'px))';pop.style.visibility='visible';fl.popup=pop;
}
function flickHighlight(x,y){
  if(!fl||!fl.popup)return;var dx=x-fl.x,dy=y-fl.y,dir='center';
  if(Math.sqrt(dx*dx+dy*dy)>25){var ang=Math.atan2(dy,dx)*180/Math.PI;if(ang>-135&&ang<=-45)dir='top';else if(ang>-45&&ang<=45)dir='right';else if(ang>45&&ang<=135)dir='bottom';else dir='left';}
  fl.popup.querySelectorAll('.flick-key').forEach(function(k){k.classList.toggle('highlight',k.dataset.direction===dir);});
}
document.addEventListener('pointerdown',function(e){
  var key=e.target.closest('[data-flick]');if(!key)return;e.preventDefault();
  fl={key:key,kind:key.dataset.flick,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,popup:null};
  try{key.setPointerCapture(e.pointerId);}catch(err){}

document.addEventListener('pointermove',function(e){

  if(fl.drag&&!fl.popup){clearTimeout(fl.timer);flickCreate();}

});
function flickEnd(e){
  if(!fl||(e&&e.pointerId!==fl.id))return;clearTimeout(fl.timer);
  var hk=fl.popup?fl.popup.querySelector('.flick-key.highlight'):null,val=null;
  if(hk)val=hk.dataset.value;else if(!fl.drag&&!fl.popup)val=FLICK[fl.kind][0];

  if(act==='undo'){draft.actions.pop();draft.amount='';fixSpot();renderCreate();return;}
  if(act==='clearacts'){draft.actions=[];draft.board=[];draft.amount='';fixSpot();renderCreate();return;}
  if(act==='act'){doAction(v);return;}
  if(act==='publish'){publishDraft();return;}
});
function fixSpot(){var c=spotCands();if(!c.some(function(x){return x.i===draft.spotIndex;})){draft.spotIndex=null;draft.answerSeat=null;}}
function doAction(type){
  var ds=draftStatus();if(ds.kind!=='act')return;var lg=legal(ds.st,ds.p);var a={street:ds.st.street,pos:ds.p,type:type};
  if(type==='bet'||type==='raise'){
    var inp=document.querySelector('[data-in="amount"]');var n=parseFloat(inp?inp.value:draft.amount);
    if(isNaN(n)||n<lg.minTo-0.0001||n>lg.maxTo+0.0001){toast(nf(lg.minTo)+'〜'+nf(lg.maxTo)+'bb の範囲で入力してください');return;}
    a.to=r2(n);
  }
  draft.actions.push(a);draft.amount='';renderCreate();
}
function publishDraft(){
  var e=[],ds=draftStatus();
  var kh=knownHands();
  if(!kh[draft.hero])e.push('Hero（'+draft.hero+'）のハンドを入力してください。');
  POS.forEach(function(p){var l=(draft.hands[p]||'').length;if(l>0&&l<4)e.push(p+' のハンドが途中です。2枚入力するか C で消してください。');});
  if(ds.kind==='act'||ds.kind==='board')e.push('ハンドを最後まで入力してください。');
  if(draft.spotIndex==null)e.push('スポットを選択してください。');
  if(!draft.title.trim())e.push('タイトルを入力してください。');
  draft.errors=e;
  if(e.length){renderCreate();return;}
  var h=dHand();
  if(ds.kind==='showdown'){activeP(ds.st).forEach(function(p){if(p!==draft.hero&&!h.showdown[p])h.showdown[p]='muck';});}
  DB.unshift({id:'p'+Date.now(),author:'me',createdAt:Date.now(),title:draft.title.trim(),hand:h,spotIndex:draft.spotIndex,answerSeat:draft.answerSeat,answers:[],hostAnswer:null,seed:null});
  save();draft=null;listUI.tab='mine';listUI.street='all';toast('投稿しました');go('#/');
}
function submitAnswer(){
  var post=getPost(ans.id),info=spotInfo(post),err='';
  var used={};Object.keys(ans.paint).forEach(function(l){Object.keys(ans.paint[l]).forEach(function(k){if(ans.paint[l][k]>0)used[k]=true;});});
  if(!Object.keys(ans.paint).length)err='少なくとも1マスを塗ってください。';
  if(!err&&used.s1){
    var a1=parseFloat(ans.sizes.s1),lo=info.lg.minTo,hi=info.lg.maxTo;
    if(isNaN(a1)||a1<lo-0.0001||a1>hi+0.0001)err='サイズは '+nf(lo)+'〜'+nf(hi)+'bb にしてください。';
  }
  if(err){document.getElementById('perr').textContent=err;return;}
  var rec={user:'me',paint:clone(ans.paint),sizes:clone(ans.sizes),at:Date.now()};
  if(post.author==='me')post.hostAnswer=rec;
  else{post.answers=post.answers.filter(function(a){return a.user!=='me';});post.answers.push(rec);}
  save();stopTimer();toast(post.author==='me'?'予想を保存しました':'回答しました');go('#/result/'+post.id);
}
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='sizeNum'||k==='sizeRange'){ans.sizes.s1=t.value;updateSizeUI();return;}
  if(k==='basic'){draft[t.dataset.k]=t.value;return;}
  if(k==='stack'){draft.stacks[t.dataset.p]=t.value;return;}
  if(k==='title'){draft.title=t.value;var c=document.getElementById('tcount');if(c)c.textContent=t.value.length+' / 40';return;}
  if(k==='amount'){draft.amount=t.value;return;}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='hero'){draft.hero=t.value;draft.spotIndex=null;draft.answerSeat=null;renderCreate();return;}
  if(k==='spot'){draft.spotIndex=+t.value;draft.answerSeat=null;renderCreate();return;}
  if(k==='seat'){draft.answerSeat=t.value;return;}
  if(k==='basic'||k==='stack'){renderCreate();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(modalRoot.innerHTML)closeModal();else closeKP();}});
window.addEventListener('resize',function(){if(applyMode())rerender();});

/* ---------- router ---------- */
function route(){
  stopTimer();closeModal();closeKP();applyMode();
  var parts=location.hash.replace(/^#\/?/,'').split('/'),v=parts[0]||'list',id=parts[1];
  window.scrollTo(0,0);
  if(v==='answer'||v==='result'){
    var post=getPost(id);if(!post||spotStop(post)<0){ans=null;res=null;renderList();return;}
    if(v==='result'&&post.author!=='me'&&!myAnswer(post)){location.replace('#/answer/'+id);return;}
    currentView=v;
    if(v==='answer'){res=null;initAnswer(post);renderAnswer(post);}else{ans=null;initResult(post);renderResult(post);}
    return;
  }
  ans=null;res=null;
  if(v==='create'){currentView='create';if(!draft)draft=newDraft();draft.errors=[];renderCreate();return;}
  currentView='list';renderList();
}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
